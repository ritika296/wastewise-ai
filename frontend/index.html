<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WasteWise AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    ember: {50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',
            500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12'},
    char: {800:'#292524',900:'#1c1917'}
  }}}}
</script>
<style>
  body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#fafaf9;}
  .tab-active{background:#9a3412;color:#fff}
  .card{background:#fff;border:1px solid #f0ebe6;border-radius:12px}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:#fdba74;border-radius:8px}
</style>
</head>
<body class="text-char-900">
  <div id="login-screen" class="min-h-screen flex items-center justify-center bg-char-900">
    <div class="card p-8 w-96">
      <div class="text-2xl font-bold text-ember-700 mb-1">WasteWise AI</div>
      <div class="text-sm text-char-800 mb-6">Predict demand. Reduce waste. Optimize every meal.</div>
      <label class="text-xs font-semibold text-char-800">Username</label>
      <input id="login-username" class="w-full border border-ember-200 rounded-lg px-3 py-2 text-sm mt-1 mb-4" placeholder="manager" autocomplete="username" />
      <label class="text-xs font-semibold text-char-800">Password</label>
      <input id="login-password" type="password" class="w-full border border-ember-200 rounded-lg px-3 py-2 text-sm mt-1 mb-1" placeholder="••••••••" autocomplete="current-password" />
      <div id="login-error" class="text-xs text-red-600 mb-3 hidden"></div>
      <button id="login-btn" class="w-full bg-ember-700 text-white rounded-lg py-2 text-sm font-semibold hover:bg-ember-800 mt-3">Sign in</button>
      <div class="text-xs text-char-800/60 mt-3">
        Demo accounts (password <span class="font-mono">wastewise123</span>): manager, regional, finance, admin.
      </div>
    </div>
  </div>

  <div id="app" class="min-h-screen hidden flex">
    <aside class="w-64 shrink-0 bg-char-900 text-white flex flex-col">
      <div class="px-5 py-5 border-b border-char-800">
        <div class="text-lg font-bold text-ember-400">WasteWise AI</div>
        <div class="text-xs text-white/60" id="user-badge"></div>
      </div>
      <nav id="nav" class="flex-1 py-3 space-y-1 px-2 text-sm overflow-y-auto"></nav>
      <div class="px-4 py-3 border-t border-char-800">
        <button id="logout-btn" class="w-full text-left text-[12px] text-white/70 hover:text-white mb-2">Sign out</button>
        <div class="text-[11px] text-white/40">API: <span id="api-status">checking…</span></div>
      </div>
    </aside>
    <main class="flex-1 overflow-y-auto">
      <div id="page" class="p-6 max-w-7xl mx-auto"></div>
    </main>
  </div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="components.js"></script>
<script src="pages/dashboard.js"></script>
<script src="pages/forecast.js"></script>
<script src="pages/risk.js"></script>
<script src="pages/recommendations.js"></script>
<script src="pages/itemDetail.js"></script>
<script src="pages/copilot.js"></script>
<script src="pages/whatif.js"></script>
<script src="pages/mlops.js"></script>
<script src="pages/llmops.js"></script>
<script src="pages/cost.js"></script>
<script src="pages/latency.js"></script>
<script src="pages/dataquality.js"></script>
<script src="pages/businessimpact.js"></script>
<script src="pages/upload.js"></script>
<script src="app.js"></script>
</body>
</html>
